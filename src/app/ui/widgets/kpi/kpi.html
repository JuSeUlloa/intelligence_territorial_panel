<div
  class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5 lg:[&>*:first-child]:ml-4 lg:[&>*:last-child]:mr-4"
  aria-label="Indicadores del panel"
>
  @for (tarjeta of tarjetas; track tarjeta.id) {
    <div class="card flex items-center gap-3 px-3 py-3 shadow-sm min-[420px]:px-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary-soft text-primary"
      >
        <i class="{{ tarjeta.icono }}" aria-hidden="true"></i>
      </span>
      <div class="min-w-0">
        <p class="truncate text-xs font-medium text-subtle">{{ tarjeta.etiqueta }}</p>
        <p
          class="text-lg leading-tight font-bold"
          [class.italic]="tarjeta.mutado"
          [class.text-subtle]="tarjeta.mutado"
          [class.font-semibold]="tarjeta.mutado"
          [class.font-bold]="!tarjeta.mutado"
        >
          {{ tarjeta.valor }}
        </p>
      </div>
    </div>
  }
</div>
